<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Barbearia | Agende seu horário</title>
<meta name="description" content="Escolha o serviço, o dia e o horário. A confirmação é feita pelo WhatsApp.">
<meta name="theme-color" content="#0f1e33">
<style>
:root{--ink:#0f1e33;--bg:#eef1f4;--card:#fff;--red:#c8302b;--blue:#2a5aa8;--line:#d3dae3;--ok:#1f8a4c}
@media(prefers-color-scheme:dark){:root{--ink:#eef1f4;--bg:#0f1e33;--card:#17294a;--line:#2c4166}}
*{box-sizing:border-box;margin:0}
body{font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink)}
.pole{height:14px;background:repeating-linear-gradient(-45deg,var(--red) 0 14px,#fff 14px 28px,var(--blue) 28px 42px,#fff 42px 56px)}
main{max-width:480px;margin:0 auto;padding:24px 16px 48px}
h1{font-size:2rem;line-height:1.1;letter-spacing:-.02em}
p.sub{margin:6px 0 24px;opacity:.75}
h2{font-size:1rem;margin:22px 0 8px}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opts button{font:inherit;color:inherit;background:var(--card);border:2px solid var(--line);border-radius:8px;padding:10px 14px;cursor:pointer;text-align:left}
.opts button small{display:block;opacity:.7;font-size:.8rem}
.opts button[aria-pressed=true]{border-color:var(--red);box-shadow:inset 0 0 0 1px var(--red)}
.opts button:focus-visible,.go:focus-visible,input:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.hrs button{min-width:74px;text-align:center}
input{width:100%;font:inherit;color:inherit;background:var(--card);border:2px solid var(--line);border-radius:8px;padding:11px 12px}
.go{display:block;width:100%;margin-top:26px;padding:15px;border:0;border-radius:8px;background:var(--ok);color:#fff;font:inherit;font-weight:700;font-size:1.05rem;cursor:pointer}
.go:disabled{background:var(--line);color:var(--ink);opacity:.6;cursor:not-allowed}
#msg{min-height:1.4em;margin-top:8px;font-size:.9rem;opacity:.8}
footer{margin-top:28px;font-size:.85rem;opacity:.7}
</style>
</head>
<body>
<div class="pole" aria-hidden="true"></div>
<main>
  <h1>Agende seu corte</h1>
  <p class="sub">Escolha abaixo. Você confirma o pedido pelo WhatsApp.</p>

  <h2>Serviço</h2>
  <div class="opts" id="serv"></div>

  <h2>Dia</h2>
  <div class="opts" id="dias"></div>

  <h2>Horário</h2>
  <div class="opts hrs" id="hrs"></div>

  <h2><label for="nome">Seu nome</label></h2>
  <input id="nome" autocomplete="given-name" placeholder="Ex.: João">

  <button class="go" id="go" disabled>Agendar pelo WhatsApp</button>
  <p id="msg" role="status"></p>
  <footer>Atendimento de segunda a sábado, das 9h às 19h. Domingo fechado.</footer>
</main>

<script>
// ===== Edite aqui =====
const ZAP = "5522999543927";
const SERVICOS = [
  ["Corte", "R$ 35"],
  ["Barba", "R$ 25"],
  ["Corte + barba", "R$ 55"],
  ["Sobrancelha", "R$ 10"]
];
const ABRE = 9, FECHA = 19; // horários de 1 em 1 hora
// ======================

const $ = id => document.getElementById(id);
const sel = {s: null, d: null, h: null};
const DS = ["dom","seg","ter","qua","qui","sex","sáb"];

function grupo(el, itens, chave, cls) {
  el.innerHTML = "";
  itens.forEach(([txt, sub, val]) => {
    const b = document.createElement("button");
    b.type = "button";
    b.setAttribute("aria-pressed", "false");
    b.innerHTML = txt + (sub ? "<small>" + sub + "</small>" : "");
    b.onclick = () => {
      sel[chave] = val ?? txt;
      [...el.children].forEach(x => x.setAttribute("aria-pressed", x === b));
      if (chave === "d") { sel.h = null; horas(); }
      checa();
    };
    el.appendChild(b);
  });
}

function dias() {
  const lista = [], hoje = new Date();
  for (let i = 0; lista.length < 7; i++) {
    const d = new Date(hoje); d.setDate(hoje.getDate() + i);
    if (d.getDay() === 0) continue;
    if (i === 0 && hoje.getHours() >= FECHA - 1) continue;
    const dm = String(d.getDate()).padStart(2,"0") + "/" + String(d.getMonth()+1).padStart(2,"0");
    const rot = i === 0 ? "Hoje" : i === 1 ? "Amanhã" : DS[d.getDay()];
    lista.push([rot, dm, rot + " " + dm]);
  }
  grupo($("dias"), lista, "d");
}

function horas() {
  const lista = [], hoje = sel.d && sel.d.startsWith("Hoje"), agora = new Date().getHours();
  for (let h = ABRE; h < FECHA; h++) {
    if (hoje && h <= agora) continue;
    lista.push([h + "h", "", h + "h"]);
  }
  grupo($("hrs"), lista, "h");
  if (!sel.d) $("hrs").innerHTML = '<span style="opacity:.6">Escolha o dia primeiro.</span>';
}

function checa() {
  const ok = sel.s && sel.d && sel.h && $("nome").value.trim();
  $("go").disabled = !ok;
  $("msg").textContent = ok ? "" : "Falta escolher: " +
    [!sel.s && "serviço", !sel.d && "dia", !sel.h && "horário", !$("nome").value.trim() && "nome"].filter(Boolean).join(", ") + ".";
}

$("nome").oninput = checa;
$("go").onclick = () => {
  const t = `Olá! Sou ${$("nome").value.trim()}. Quero agendar: ${sel.s}, ${sel.d} às ${sel.h}. Pode confirmar?`;
  window.open("https://wa.me/" + ZAP + "?text=" + encodeURIComponent(t), "_blank", "noopener");
};

grupo($("serv"), SERVICOS.map(([n,p]) => [n,p,n]), "s");
dias(); horas(); checa();
</script>
</body>
</html>
