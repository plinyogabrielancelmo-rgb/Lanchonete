<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Barbearia | Agende seu horário</title>
<meta name="description" content="Escolha o serviço, o dia e o horário. Confirmação rápida pelo WhatsApp.">
<meta name="theme-color" content="#10241d">
<style>
:root{--g:#10241d;--g2:#1a3a2e;--brass:#b98a3e;--brass2:#d8b26a;--bg:#f2f3ef;--card:#fff;--ink:#16211c;--mut:#65726b;--line:#dde1db;--wa:#1faa59}
@media(prefers-color-scheme:dark){:root{--bg:#0c1a15;--card:#132a21;--ink:#eef1ec;--mut:#9fb0a6;--line:#25423a}}
*{box-sizing:border-box;margin:0}
body{font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink)}
.hero{background:var(--g);color:#f2f3ef;padding:44px 20px 88px;position:relative;overflow:hidden}
.hero::before{content:"";position:absolute;left:0;top:0;bottom:0;width:10px;background:repeating-linear-gradient(-45deg,var(--brass) 0 12px,#f2f3ef 12px 24px,var(--g2) 24px 36px,#f2f3ef 36px 48px)}
.wrap{max-width:520px;margin:0 auto}
.brand{font:600 .85rem/1 system-ui,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:var(--brass2)}
h1{font:400 clamp(2.3rem,9vw,3.2rem)/1.05 Georgia,"Times New Roman",serif;margin:14px 0 12px}
.hero p{color:#c3cfc8;max-width:36ch}
.card{background:var(--card);margin:-56px 16px 0;border-radius:14px;padding:22px 18px 24px;box-shadow:0 12px 32px rgba(8,20,15,.18);position:relative}
@media(min-width:552px){.card{margin:-56px auto 0;max-width:520px;padding:26px 26px 28px}}
.step{margin-bottom:24px}
.step h2{display:flex;align-items:center;gap:10px;font-size:1rem;font-weight:600;margin-bottom:12px}
.step h2 i{font:normal 600 .8rem/1 system-ui;width:24px;height:24px;border-radius:50%;background:var(--g);color:var(--brass2);display:grid;place-items:center}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--brass);outline-offset:2px}
.list{display:grid;gap:8px}
.svc{display:flex;justify-content:space-between;align-items:center;background:transparent;border:1.5px solid var(--line);border-radius:10px;padding:13px 14px;text-align:left;transition:border-color .15s,background .15s}
.svc b{font-weight:600}.svc span{color:var(--mut);font-size:.9rem}.svc em{font:normal 600 1rem Georgia,serif}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:8px}
.tile{background:transparent;border:1.5px solid var(--line);border-radius:10px;padding:9px 4px;text-align:center;line-height:1.25;transition:border-color .15s,background .15s}
.tile small{display:block;color:var(--mut);font-size:.75rem}.tile b{font-size:1.05rem}
.svc:hover,.tile:hover{border-color:var(--brass)}
[aria-pressed=true]{background:var(--g)!important;border-color:var(--g)!important;color:#f2f3ef!important}
[aria-pressed=true] small,[aria-pressed=true] span{color:var(--brass2)!important}
.hint{color:var(--mut);font-size:.9rem}
input{width:100%;font:inherit;color:inherit;background:transparent;border:1.5px solid var(--line);border-radius:10px;padding:13px 14px}
.resumo{background:var(--bg);border-radius:10px;padding:12px 14px;font-size:.92rem;color:var(--mut);min-height:48px}
.resumo b{color:var(--ink)}
.go{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;margin-top:14px;padding:16px;border:0;border-radius:10px;background:var(--wa);color:#fff;font-weight:700;font-size:1.05rem;transition:filter .15s}
.go:hover:not(:disabled){filter:brightness(1.08)}
.go:disabled{background:var(--line);color:var(--mut);cursor:not-allowed}
.go svg{width:22px;height:22px;fill:currentColor}
footer{max-width:520px;margin:28px auto 0;padding:0 20px 40px;text-align:center;color:var(--mut);font-size:.88rem}
footer b{color:var(--ink)}
</style>
</head>
<body>
<header class="hero"><div class="wrap">
  <div class="brand">Barbearia</div>
  <h1>Estilo e precisão, no seu horário.</h1>
  <p>Escolha o serviço e o horário. Você confirma tudo pelo WhatsApp em segundos.</p>
</div></header>

<main class="card">
  <section class="step"><h2><i>1</i>Serviço</h2><div class="list" id="serv"></div></section>
  <section class="step"><h2><i>2</i>Dia</h2><div class="tiles" id="dias"></div></section>
  <section class="step"><h2><i>3</i>Horário</h2><div class="tiles" id="hrs"></div></section>
  <section class="step"><h2><i>4</i><label for="nome">Seu nome</label></h2><input id="nome" autocomplete="given-name" placeholder="Como devemos te chamar?"></section>

  <div class="resumo" id="resumo" role="status"></div>
  <button class="go" id="go" disabled>
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2Zm-3 5.5c.3 0 .5 0 .7.5l.8 1.9c.1.3 0 .5-.1.7l-.6.8c-.1.2-.2.3 0 .6.4.8 1.700 2.400 3.500 3.200.3.100.5.100.7-.1l.8-1c.2-.2.4-.2.700-.1l1.800.9c.3.100.4.200.4.400 0 .6-.4 1.500-1.400 1.900-.8.300-1.800.3-3.400-.4-2.300-1-4-3.200-4.600-4.400-.5-1-.8-2.100.1-3.300.3-.4.700-.7 1.100-.7Z"/></svg>
    Agendar pelo WhatsApp
  </button>
</main>

<footer><b>Segunda a sábado, das 9h às 19h</b><br>Domingo fechado. O horário só é garantido após a nossa confirmação.</footer>

<script>
// ===== Edite aqui =====
const ZAP = "5522999543927";
const SERVICOS = [
  ["Corte", "Máquina ou tesoura", "R$ 35"],
  ["Barba", "Toalha quente e navalha", "R$ 25"],
  ["Corte + barba", "O combo completo", "R$ 55"],
  ["Sobrancelha", "Acabamento na navalha", "R$ 10"]
];
const ABRE = 9, FECHA = 19; // horários de 1 em 1 hora
// ======================

const $ = id => document.getElementById(id);
const sel = {s: null, d: null, h: null};
const DS = ["Dom","Seg","Ter","Qua","Qui","Sex","Sáb"];

function marca(el, b) { [...el.children].forEach(x => x.setAttribute("aria-pressed", x === b)); }

function servicos() {
  SERVICOS.forEach(([n, desc, p]) => {
    const b = document.createElement("button");
    b.type = "button"; b.className = "svc"; b.setAttribute("aria-pressed", "false");
    b.innerHTML = `<div><b>${n}</b><br><span>${desc}</span></div><em>${p}</em>`;
    b.onclick = () => { sel.s = n; marca($("serv"), b); atualiza(); };
    $("serv").appendChild(b);
  });
}

function dias() {
  const hoje = new Date(); let n = 0;
  for (let i = 0; n < 7; i++) {
    const d = new Date(hoje); d.setDate(hoje.getDate() + i);
    if (d.getDay() === 0) continue;
    if (i === 0 && hoje.getHours() >= FECHA - 1) continue;
    n++;
    const dm = String(d.getDate()).padStart(2,"0") + "/" + String(d.getMonth()+1).padStart(2,"0");
    const rot = i === 0 ? "Hoje" : i === 1 ? "Amanhã" : DS[d.getDay()];
    const b = document.createElement("button");
    b.type = "button"; b.className = "tile"; b.setAttribute("aria-pressed", "false");
    b.innerHTML = `<small>${rot}</small><b>${dm}</b>`;
    b.onclick = () => { sel.d = rot + " " + dm; sel.h = null; sel.hoje = i === 0; marca($("dias"), b); horas(); atualiza(); };
    $("dias").appendChild(b);
  }
}

function horas() {
  const el = $("hrs"), agora = new Date().getHours();
  el.innerHTML = "";
  if (!sel.d) { el.innerHTML = '<p class="hint">Escolha o dia primeiro.</p>'; el.style.display = "block"; return; }
  el.style.display = "";
  for (let h = ABRE; h < FECHA; h++) {
    if (sel.hoje && h <= agora) continue;
    const b = document.createElement("button");
    b.type = "button"; b.className = "tile"; b.setAttribute("aria-pressed", "false");
    b.innerHTML = `<b>${h}h</b>`;
    b.onclick = () => { sel.h = h + "h"; marca(el, b); atualiza(); };
    el.appendChild(b);
  }
}

function atualiza() {
  const nome = $("nome").value.trim();
  const falta = [!sel.s && "serviço", !sel.d && "dia", !sel.h && "horário", !nome && "nome"].filter(Boolean);
  $("go").disabled = falta.length > 0;
  $("resumo").innerHTML = falta.length
    ? "Falta escolher: " + falta.join(", ") + "."
    : `<b>${sel.s}</b>, ${sel.d} às <b>${sel.h}</b>, em nome de <b>${nome.replace(/</g,"&lt;")}</b>.`;
}

$("nome").oninput = atualiza;
$("go").onclick = () => {
  const t = `Olá! Sou ${$("nome").value.trim()}. Quero agendar: ${sel.s}, ${sel.d} às ${sel.h}. Pode confirmar?`;
  window.open("https://wa.me/" + ZAP + "?text=" + encodeURIComponent(t), "_blank", "noopener");
};

servicos(); dias(); horas(); atualiza();
</script>
</body>
</html>
